services:
  dev:
    build: .
    init: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: ${PROJECT_DIR:?run via ./dev.sh}
    volumes:
      # Same absolute path as on the host, so node_modules metadata and error paths match.
      - ./:${PROJECT_DIR}
    environment:
      # Arbitrary host UIDs have no passwd entry and no writable home.
      HOME: /tmp/home
      # Key-only: `MARKERS_STRICT=true ./dev.sh ci` makes the marker check strict.
      MARKERS_STRICT:
    ports:
      - "4321:4321"
